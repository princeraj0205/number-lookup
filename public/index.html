<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Lookup</title>
  <style>
    body {
      background: #0a0f0a;
      color: #00ff41;
      font-family: monospace;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
      border: 2px solid #00ff41;
      border-radius: 10px;
    }
    h2 {
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      background: #051005;
      color: #00ff66;
      border: 2px solid #00ff41;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      padding: 12px;
      margin: 10px 5px 0 0;
      background: #0a200a;
      color: #00ff66;
      border: 2px solid #00ff41;
      border-radius: 8px;
      cursor: pointer;
    }
    pre {
      margin-top: 20px;
      padding: 15px;
      background: #051005;
      border: 2px solid #00ff41;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #status {
      text-align: center;
      margin-top: 10px;
    }
  </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h2>Number Lookup Tool</h2>
  <input
    type="text"
    id="mobile"
    placeholder="Enter mobile number"
  >
  <br>
  <button onclick="lookup()">🔎 Lookup</button>
  <button onclick="copyJSON()">📋 Copy</button>
  <button onclick="clearAll()">🗑️ Clear</button>
  <button onclick="example()">📝 Example</button>
  <pre id="output">[*] Ready.</pre>
  <div id="status"></div>
<div class="credit">
    <div class="name">✦ Designed & Developed by @princeraj0205 ✦</div>
    <div class="email">princeraj74682@gmail.com</div>
</div>
</div>
<script>
// =====================================
// API SETTINGS
// =====================================

// =====================================
// VARIABLES
// =====================================
let lastJSON = null;
// =====================================
// NUMBER LOOKUP
// =====================================
async function lookup() {
  const input = document.getElementById("mobile");
  const output = document.getElementById("output");
  const status = document.getElementById("status");
  const number = input.value.trim();
  // Check empty input
  if (!number) {
    output.textContent = JSON.stringify({
      error: "Enter a number"
    }, null, 2);
    status.textContent = "";
    return;
  }
  // Keep only numbers
  const cleanNumber = number.replace(/[^0-9]/g, "");
  // Check number length
  if (cleanNumber.length < 10) {
    output.textContent = JSON.stringify({
      error: "Invalid number (minimum 10 digits)"
    }, null, 2);
    status.textContent = "";
    return;
  }
  output.textContent = JSON.stringify({
    status: "fetching..."
  }, null, 2);
  status.textContent = "⏳ Fetching data...";
  try {
    // =====================================
    // API URL
    // =====================================
    const response = await fetch(
  `/api/lookup?number=${encodeURIComponent(cleanNumber)}`
);
    // Check HTTP error
    if (!response.ok) {
      throw new Error(
        "HTTP Error: " + response.status
      );
    }
    // Convert response to JSON
    const data = await response.json();
    // =====================================
    // FORMAT RESPONSE
    // =====================================
    let result;
    if (
      data &&
      data.status !== "error" &&
      data.data
    ) {
      result = {
        success: true,
        number: cleanNumber,
        results: data.data
      };
    }
    else if (
      data &&
      data.status === "error"
    ) {
      result = {
        success: false,
        error: data.message || "No data found",
        number: cleanNumber
      };
    }
    else {
      result = {
        success: false,
        error: "No data found",
        number: cleanNumber
      };
    }
    // Save result
    lastJSON = result;
    // Show result
    output.textContent =
      JSON.stringify(result, null, 2);
    status.textContent =
      "✅ Lookup complete";
  }
  catch (error) {
    const errorData = {
      success: false,
      error: error.message
    };
    lastJSON = errorData;
    output.textContent =
      JSON.stringify(errorData, null, 2);
    status.textContent =
      "❌ Error";
  }
}
// =====================================
// COPY JSON
// =====================================
function copyJSON() {
  if (lastJSON === null) {
    alert(
      "No JSON to copy. Do a lookup first."
    );
    return;
  }
  const json =
    JSON.stringify(lastJSON, null, 2);
  navigator.clipboard
    .writeText(json)
    .then(() => {
      document.getElementById("status")
        .textContent =
        "📋 JSON copied!";
    })
    .catch(() => {
      alert("Failed to copy.");
    });
}
// =====================================
// CLEAR
// =====================================
function clearAll() {
  document.getElementById("mobile").value = "";
  document.getElementById("output")
    .textContent = "[*] Ready.";
  document.getElementById("status")
    .textContent = "";
  lastJSON = null;
}
// =====================================
// EXAMPLE
// =====================================
function example() {
  document.getElementById("mobile")
    .value = "9876543210";
}
</script>
</body>
</html>
